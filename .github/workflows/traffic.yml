name: traffic-snapshot

# 数据源：Cloudflare Web Analytics (RUM) —— GitHub Traffic 统计的是仓库页面访问，
# 跟 GitHub Pages 站点的访客无关（实测恒为 0），已弃用。
#
# 每天拉一次 CF GraphQL，按日期并进 data/traffic.json（取较大值，防同一天被重复统计），
# 提交回本仓库 → Pages 重发 → 看板页 /stats/ 读到新数据。
#
# 需要的仓库 secrets：
#   CF_API_TOKEN   —— Cloudflare API Token，权限 Account > Account Analytics > Read
#   CF_ACCOUNT_TAG —— 账户 ID（32 位 hex）。不给则脚本用 GET /accounts 自动取第一个
on:
  schedule:
    - cron: '17 1 * * *'   # UTC 01:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取 Cloudflare RUM 数据并累积历史
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_TAG: ${{ secrets.CF_ACCOUNT_TAG }}
        run: |
          ARGS="--days 30"
          if [ -n "$CF_ACCOUNT_TAG" ]; then
            ARGS="$ARGS --account $CF_ACCOUNT_TAG"
          fi
          python3 tools/fetch-cf-analytics.py $ARGS

      - name: 有变化才提交
        run: |
          git config user.name  "Breeze88-hub"
          git config user.email "Breeze88-hub@users.noreply.github.com"
          git add data/traffic.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: traffic snapshot $(date -u +%Y-%m-%d)"
          git push